  // ---- Scene 10: the decoder tower, built from the bottom up in the same visual language
  async function buildDecoder(run) {
    const L = L10_decoder();
    await Promise.all([run.morph("cap:example", { o: 0 }, { dur: 400 }), run.morph("pair", { o: 0 }, { dur: 400 })]);
    if (run.dead) return;
    await reveal(run, L, [
      [...DTOK.slice(0, 4), "dec:win"],
      ["dec:emb", "dec:wemb", "dec:pe", "dec:peicon", "dec:pelab", "dec:wpe"],
      ["dec:w0", "dec:mm", "dec:r1"], ["dec:w1", "dec:an1"], ["dec:w2", "dec:cross", "dec:r2"], ["dec:w3", "dec:an2"],
      ["dec:w4", "dec:ffn", "dec:r3"], ["dec:w5", "dec:an3"],
      ["dec:frame", "dec:g1", "dec:g2", "dec:g3", "dec:g4", "dec:g5", "dec:n6"],
      ["dec:w6", "dec:lin"], ["dec:w7", "dec:sm", "dec:title"], ["dec:w8"],
    ], { dur: 520, gap: 250 });
  }

  // ---- Scene 10: masked self-attention, opened: future positions get −∞ before softmax, so exactly 0 after
  async function maskOpen(run) {
    const L = L10_mask(), mm = decGeo().blocks.mm, box = REG.get("mg:box");
    run.set(box, { x: mm.x, y: mm.y, w: mm.w, h: mm.h, s: 1, o: 0, lo: 0 });
    await Promise.all([run.tween(box, { o: 1 }, { dur: 300 }), run.morph("dec:mm", { glow: 0.6 }, { dur: 400 })]);
    const MB = mgGeo(digits()).box;
    await run.tween(box, { x: MB.x, y: MB.y, w: MB.w, h: MB.h }, { dur: 900 });
    if (run.dead) return;
    const stage = (st) => maskGrid(new Layout(), st);
    const S0 = stage("logits"), S1 = stage("masked");
    await Promise.all([0, 1, 2, 3].flatMap((i) => [run.morph(`mg:rl${i}`, S0.get(`mg:rl${i}`), { dur: 400 }), run.morph(`mg:cl${i}`, S0.get(`mg:cl${i}`), { dur: 400 })]));
    // every query–key score, q_i·k_j / √d_k, before masking
    await Promise.all([...S0.keys()].filter((id) => /^mg:[cv]\d\d$/.test(id)).map((id) => run.morph(id, S0.get(id), { dur: 500, delay: 40 * (Number(id.slice(-2, -1)) + Number(id.slice(-1))) })));
    await run.wait(700);
    if (run.dead) return;
    // the future (key position after the query position) is set to −∞
    await Promise.all([...S1.keys()].filter((id) => /^mg:[cv]\d\d$/.test(id) && Number(id.slice(-1)) > Number(id.slice(-2, -1))).map((id, k) => run.morph(id, S1.get(id), { dur: 550, delay: 90 * k })));
    await run.wait(700);
    if (run.dead) return;
    // softmax along each row: the −∞ entries become exactly 0
    await Promise.all([...L.keys()].filter((id) => /^mg:[cv]\d\d$/.test(id)).map((id) => run.morph(id, L.get(id), { dur: 600, delay: 120 * Number(id.slice(-2, -1)) })));
    await run.morph("cap:mask", L.get("cap:mask"), { dur: 600 });
  }

  // ---- Scene 10: cross-attention — Q rises from the decoder; K and V cross over from the encoder output
  async function crossOpen(run) {
    const L = L10_cross(), mm = decGeo().blocks.mm;
    const grid = [...REG.keys()].filter((id) => /^mg:(rl|cl|c|v)/.test(id));
    await Promise.all([...grid.map((id) => run.morph(id, { o: 0 }, { dur: 350 })), run.morph("cap:mask", { o: 0 }, { dur: 350 }), run.morph("dec:mm", { glow: 0 }, { dur: 600 })]);
    await run.tween(REG.get("mg:box"), { x: mm.x, y: mm.y, w: mm.w, h: mm.h, o: 0 }, { dur: 700 });
    if (run.dead) return;
    // self-attention: Q, K and V branch from one and the same stream
    await reveal(run, L, [["enc:sk", "enc:sv", "enc:sq", "dec:sk", "dec:sv", "dec:sq"], ["enc:kl", "enc:vl", "enc:ql", "dec:kl", "dec:vl", "dec:ql"]], { dur: 650, gap: 350 });
    if (run.dead) return;
    // cross-attention: K and V come from the encoder output, Q from the decoder below the block
    await reveal(run, L, [["x:k", "x:v"], ["x:kl", "x:vl"]], { dur: 1300, gap: 900 });
    await Promise.all([pulse(run, "x:k", "k", { dur: 1300 }), pulse(run, "x:v", "v", { dur: 1300, delay: 120 }), reveal(run, L, [["x:q"], ["x:ql"]], { dur: 700, gap: 500 })]);
    await Promise.all([pulse(run, "x:q", "q", { dur: 700 }), run.morph("cap:cross", L.get("cap:cross"), { dur: 600 })]);
  }

  // a signal climbing the decoder stream, block by block
  async function decoderPulse(run, dur = 1700) {
    const ws = ["w0", "w1", "w2", "w3", "w4", "w5", "w6", "w7", "w8"].map((k) => `dec:${k}`);
    for (const id of ws) { await pulse(run, id, "n", { dur: dur / ws.length }); if (run.dead) return; }
  }

  // ---- Scene 10: the decoder's output → Linear → Softmax → next-token probabilities (illustrative)
  async function outputProbs(run) {
    const L = L10_output(), d = digits();
    await run.morph("cap:cross", { o: 0 }, { dur: 400 });
    await Promise.all([reveal(run, L, [["outl:0", "outl:1", "outl:2"]], { dur: 600 }), decoderPulse(run)]);
    if (run.dead) return;
    await Promise.all([run.morph("pb:title", L.get("pb:title"), { dur: 500 }), ...DEC.next.vocab.map((_, k) => run.morph(`pb:w${k}`, { ...L.get(`pb:w${k}`), pill: 0 }, { dur: 500, delay: k * 60 }))]);
    await Promise.all(DEC.next.vocab.map((_, k) => {
      const b = REG.get(`pb:bar${k}`), t = L.get(`pb:bar${k}`), v = REG.get(`pb:v${k}`), tv = L.get(`pb:v${k}`);
      b.setAlphaSrc(t.alphaSrc, "pbar");
      run.set(b, { x: t.x, y: t.y, o: 1, w: 0 });
      v.bind(tv.src, d);
      run.set(v, { x: PB.x + 14, y: tv.y, s: 1, o: 0, tf: 1 });
      return Promise.all([run.tween(b, { w: t.w }, { dur: 1000, delay: k * 70, ease: EASE.out }), run.tween(v, { x: tv.x, o: 1 }, { dur: 1000, delay: k * 70, ease: EASE.out })]);
    }));
    await Promise.all([run.morph("pb:note", L.get("pb:note"), { dur: 600 }), run.morph("pb:w0", L.get("pb:w0"), { dur: 600, delay: 300 })]);
  }

  // ---- Scene 10: autoregressive loop — predict, append, feed back, predict again
  async function loopBack(run) {
    const L = L10_loop(), F = REG.get("pb:w0");
    await Promise.all([run.morph("cap:loop", L.get("cap:loop"), { dur: 600 }), ...[...L.keys()].filter((id) => /^pb:(bar|v|w)[1-5]$|^pb:(bar|v)0$/.test(id)).map((id) => run.morph(id, L.get(id), { dur: 600 }))]);
    // the chosen word joins the translation so far
    await run.morph(F, L.get("pb:w0"), { dur: 1100 });
    if (run.dead) return;
    // …and is fed back as the next decoder input (outputs are shifted right by one position)
    const lp = REG.get("loop:path"), tok = REG.get("dtok:4"), tt = L.get("dtok:4");
    lp.morph({ geo: L.get("loop:path").geo }, { dur: 0 });
    run.set(lp, { o: 1, draw: 0 });
    run.set(tok, { x: F.x, y: F.y, s: 0.62, o: 1, pill: 0 });
    const ride = { f: 0, apply() { const pt = lp.pointAt(this.f); tok.set({ x: pt.x, y: pt.y + 8 }); } };
    await Promise.all([run.tween(lp, { draw: 1 }, { dur: 1500 }), run.tween(ride, { f: 1 }, { dur: 1500 }), run.tween(tok, { s: 0.5 }, { dur: 1500 })]);
    if (run.dead) return;
    await Promise.all([...DTOK.map((id) => run.morph(id, L.get(id), { dur: 700 })), run.morph("outl:more", L.get("outl:more"), { dur: 600, delay: 600 })]);
    // predict again: the whole decoder runs once more with the longer input
    await decoderPulse(run, 1500);
  }

  // ---- Scene 10: final shot — the whole Transformer; the encoder's self-attention block lights up
  async function finalShot(run) {
    const L = L10_final();
    await fadeOutsideOf(run, L, 600);
    if (run.dead) return;
    const rest = [...L.keys()].filter((id) => !id.startsWith("cap:") && !MINI.includes(id) && id !== "fin:box");
    await Promise.all([run.morph("cap:loop", { o: 0 }, { dur: 400 }), ...rest.map((id) => run.morph(id, L.get(id), { dur: 1000 }))]);
    if (run.dead) return;
    // Scene 8's arcs fly back out of the block they live in, and open up above it
    const box = REG.get("fin:box"), mb = encGeo("tower").blocks.mhsa;
    run.set(box, { x: mb.x, y: mb.y, w: mb.w, h: mb.h, s: 1, o: 0, lo: 0, glow: 0 });
    MINI.forEach((id) => run.set(REG.get(id), { o: 0.02 }));
    await Promise.all([run.tween(box, { ...FIN, o: 1, glow: 0.35 }, { dur: 1500 }), ...MINI.map((id) => run.morph(id, L.get(id), { dur: 1500 })),
      reveal(run, L, [["fin:l", "fin:r"]], { dur: 900 })]);
    await run.morph("cap:final", L.get("cap:final"), { dur: 900 });
  }

  // Morph one object to its target in layout L, with its layout defaults (as applyLayout does), so props a
  // layout leaves unset (a highlight, a solo row, the index header) animate back too instead of snapping later.
  const pto = (run, L, id, opts) => run.morph(id, { ...REG.get(id).layoutDefaults(), ...L.get(id) }, opts);

  // ---- Epilogue: from the full Transformer back to one token. The toy x_it, then a vector of the paper's size:
  // the toy's brackets stretch out, the strip draws in and different numbers appear — a separate, much larger
  // space with illustrative values, not the 4-d vector extended.
  async function paperVector(run) {
    const L = Lp_vector();
    await fadeOutsideOf(run, L, 520);
    if (run.dead) return;
    await Promise.all([pto(run, L, "tag:paper", { dur: 400 }), pto(run, L, "cap:pvector", { dur: 560 })]);
    await reveal(run, L, [["p:toy"], ["p:toylab", "p:toydim"], ["p:cmp:dt", "p:cmp:d0", "p:cmp:d1", "p:cmp:d2", "p:cmp:d3"]], { dur: 480, gap: 180 });
    if (run.dead) return;
    const toy = REG.get("p:toy"), X = REG.get("p:X"), tX = L.get("p:X");
    const gb = run.own(new BracketPair(LAYER.fx, "v-x"));
    run.set(gb, { x: toy.x, y: toy.y, hw: toy.bw * toy.s, hh: toy.bh * toy.s, o: 0.95 });
    await run.tween(gb, { x: tX.x, y: PS.vecY, hw: X.halfW(), hh: X.size * 0.82 }, { dur: 960 });
    if (run.dead) return;
    run.set(X, { ...X.layoutDefaults(), ...tX, nu: 0, ix: 0, draw: 0, glow: 0 });
    run.set(gb, { o: 0 });
    await Promise.all([run.tween(X, { draw: 1, glow: 1 }, { dur: 1040, ease: EASE.out }), run.tween(X, { nu: 1 }, { dur: 480, delay: 520 }), run.tween(X, { ix: 1 }, { dur: 480, delay: 760 })]);
    await reveal(run, L, [["p:xlab", "p:xdim"], ["p:note"], ["p:cmp:pt", "p:cmp:p0", "p:cmp:p1", "p:cmp:p2", "p:cmp:p3"]], { dur: 480, gap: 210 });
  }

  // ---- Epilogue: that vector is one row of X; the other seven tokens' rows open up around it
  async function paperMatrixPlay(run) {
    const L = Lp_matrix();
    await fadeOutsideOf(run, L, 360);
    if (run.dead) return;
    await pto(run, L, "p:X", { dur: 1120 });
    if (run.dead) return;
    await reveal(run, L, [...TOKENS.map((_, j) => [`tok:${j}`]), ["p:Xlab"], ["p:Xdims", "cap:pmatrix"]], { dur: 400, gap: 90 });
  }

  // ---- Epilogue: one head at paper size — X (8×512) · W (512×64) = Q, K, V (8×64)
  async function paperQKVPlay(run) {
    const L = Lp_qkv();
    await fadeOutsideOf(run, L, 360);
    if (run.dead) return;
    // X folds into a compact block: the numbers are swallowed, one strip per token remains
    await Promise.all([pto(run, L, "p:X", { dur: 1120 }), pto(run, L, "p:Xlab", { dur: 1120 })]);
    if (run.dead) return;
    await reveal(run, L, [["p:w1:q", "p:w1:k", "p:w1:v"], ["p:W:q", "p:W:k", "p:W:v", "p:Wlab:q", "p:Wlab:k", "p:Wlab:v"], ["p:w2:q", "p:w2:k", "p:w2:v"],
      ["p:B:q0", "p:B:k0", "p:B:v0", "p:Olab:q", "p:Olab:k", "p:Olab:v"]], { dur: 520, gap: 260 });
    if (run.dead) return;
    // the row of "it" travels through W_Q and becomes the query row of "it"
    await pulse(run, "p:w1:q", "q", { dur: 600 });
    await pulse(run, "p:w2:q", "q", { dur: 440 });
    if (run.dead) return;
    const X = REG.get("p:X"), Q = REG.get("p:B:q0"), xa = X.rowAbs(FOCUS), qy = Q.y - Q.h / 2 + ((FOCUS + 0.5) * Q.h) / N;
    const xr = REG.get("p:xrow"), qr = REG.get("p:qrow"), tx = L.get("p:xrow"), tq = L.get("p:qrow");
    run.set(xr, { ...xr.layoutDefaults(), ...tx, x: xa.x, y: xa.y, s: 0.45, o: 0, glow: 0 });
    run.set(qr, { ...qr.layoutDefaults(), ...tq, x: Q.x, y: qy, s: 0.3, o: 0, glow: 0 });
    await Promise.all([run.tween(xr, { x: tx.x, y: tx.y, s: 1, o: 1, glow: tx.glow }, { dur: 880 }), run.tween(qr, { x: tq.x, y: tq.y, s: 1, o: 1, glow: tq.glow }, { dur: 880, delay: 280 }),
      pto(run, L, "p:op", { dur: 480, delay: 560 })]);
    await reveal(run, L, [["p:xrowlab", "p:qrowlab"], ["cap:pqkv"]], { dur: 480, gap: 200 });
  }

  // ---- Epilogue: the same head eight times over, each with its own W_Q, W_K, W_V — then Concat and W^O
  async function paperHeadsPlay(run) {
    const L = Lp_heads(), heads = [...Array(PD.nHeads).keys()];
    await fadeOutsideOf(run, L, 360);
    if (run.dead) return;
    // head 1's Q, K and V (just computed) become the first lane
    await Promise.all(BRANCHES.map((b) => pto(run, L, `p:B:${b}0`, { dur: 800 })));
    if (run.dead) return;
    await reveal(run, L, [["p:hq", "p:hk", "p:hv", "p:lt:0"], ...heads.slice(1).map((h) => [`p:lt:${h}`, ...BRANCHES.map((b) => `p:B:${b}${h}`)])], { dur: 360, gap: 90 });
    if (run.dead) return;
    await reveal(run, L, [["p:hz"], ...heads.map((h) => [`p:lw:${h}`, `p:B:z${h}`])], { dur: 360, gap: 70 });
    if (run.dead) return;
    await reveal(run, L, [["p:hform", "p:hdims"], heads.map((h) => `p:fw:${h}`)], { dur: 560, gap: 210 });
    if (run.dead) return;
    // the eight 64-wide head outputs slide side by side into one 512-wide block: Concat
    const cat = L.get("p:B:cat"), seg = cat.w / PD.nHeads;
    const flies = heads.map((h) => {
      const z = REG.get(`p:B:z${h}`), f = run.own(new BlockObj(null, LAYER.fx, { url: z.url, tone: "v", w: z.w, h: z.h }));
      run.set(f, { x: z.x, y: z.y, o: 1 });
      return f;
    });
    await Promise.all(flies.map((f, h) => run.tween(f, { x: cat.x - cat.w / 2 + seg * (h + 0.5), y: cat.y, w: seg, h: cat.h }, { dur: 880, delay: 40 * h })));
    if (run.dead) return;
    await Promise.all([pto(run, L, "p:B:cat", { dur: 240 }), pto(run, L, "p:catlab", { dur: 480 })]);
    flies.forEach((f) => run.set(f, { o: 0 }));
    await reveal(run, L, [["p:cw1"], ["p:B:wo", "p:wolab"], ["p:cw2"], ["p:B:mh", "p:mhlab"], ["cap:pheads"]], { dur: 480, gap: 240 });
  }

  // ---- Epilogue: back to the full Transformer — the same multi-head attention, used in three ways (§3.2.3)
  async function paperUsesPlay(run) {
    const L = Lp_uses(), mb = encGeo("tower").blocks.mhsa;
    const leaving = [...REG.values()].filter((o) => o.id && o.o > 0.01 && !(L.get(o.id)?.o > 0));
    await Promise.all(leaving.filter((o) => !(o instanceof BlockObj)).map((o) => run.morph(o, { o: 0 }, { dur: 280 })));
    if (run.dead) return;
    // the encoder's self-attention block appears, and the whole eight-head machine folds into it…
    await run.morph("enc:mhsa", { ...REG.get("enc:mhsa").layoutDefaults(), ...L.get("enc:mhsa"), glow: 0.8 }, { dur: 360 });
    if (run.dead) return;
    const k = 0.075, cx = 800, cy = 550; // the machine's centre, mapped onto the block
    await Promise.all(leaving.filter((o) => o instanceof BlockObj).map((b) =>
      run.tween(b, { x: mb.x + k * (b.x - cx), y: mb.y + k * (b.y - cy), w: b.w * k, h: b.h * k, o: 0 }, { dur: 800, ease: EASE.inOut })));
    if (run.dead) return;
    // …and the rest of the Transformer returns around it
    const diagram = [...L.keys()].filter((id) => L.get(id).o > 0 && !/^p:(u:|final)/.test(id) && id !== "enc:mhsa" && REG.get(id).o < 0.99);
    await Promise.all(diagram.map((id) => run.morph(id, { ...REG.get(id).layoutDefaults(), ...L.get(id), ...(USES.some(([u]) => u === id) ? { glow: 0 } : {}) }, { dur: 720 })));
    if (run.dead) return;
    await run.morph("cap:puses", { x: 960, y: Y.cap, o: 1 }, { dur: 480 });
    for (const [blk, ids] of USES) {
      await Promise.all([run.morph(blk, { glow: 1 }, { dur: 480 }), ...ids.map((id, i) => pto(run, L, id, { dur: 480, delay: 100 + 100 * i }))]);
      if (run.dead) return;
      if (blk === "dec:cross") await Promise.all([pulse(run, "x:k", "k", { dur: 880 }), pulse(run, "x:v", "v", { dur: 880, delay: 100 }), pulse(run, "x:q", "q", { dur: 480, delay: 240 })]);
      else await run.wait(360);
    }
    await reveal(run, L, [["p:u:l1", "p:u:l2"]], { dur: 480 });
    await run.morph("cap:puses", { o: 0 }, { dur: 360 });
    await pto(run, L, "p:final", { dur: 720 });
  }

  // ---- Inside the decoder: choreography helpers
  // a compressed vector or heat block draws in from the left; a vector's numbers and index header follow
  async function drawIn(run, L, id, { dur = 700, delay = 0 } = {}) {
    const o = REG.get(id), t = { ...o.layoutDefaults(), ...L.get(id) }, cm = o instanceof CMatObj;
    if (delay) await run.wait(delay);
    if (run.dead) return;
    run.set(o, { ...t, draw: 0, glow: 0, ...(cm ? { nu: 0, ix: 0 } : {}) });
    const ps = [run.tween(o, { draw: 1, glow: t.glow ?? 0 }, { dur, ease: EASE.out })];
    if (cm) ps.push(run.tween(o, { nu: t.nu }, { dur: dur * 0.5, delay: dur * 0.45 }), run.tween(o, { ix: t.ix }, { dur: dur * 0.5, delay: dur * 0.6 }));
    await Promise.all(ps);
  }
  // camera-style move: objects scale by k about (cx, cy), landing around (tx, ty), and fade to o
  const zoomObjs = (run, objs, { cx, cy, tx = cx, ty = cy, k, o = 0, dur = 1200 }) =>
    Promise.all(objs.map((ob) => run.tween(ob, { x: tx + k * (ob.x - cx), y: ty + k * (ob.y - cy), s: ob.s * k, o }, { dur, ease: EASE.inOut })));
  // everything visible that layout L does not show (except `keep`) fades
  const fadeExcept = (run, L, keep = [], dur = 420) =>
    Promise.all([...REG.values()].filter((o) => o.id && o.o > 0.01 && !L.has(o.id) && !keep.includes(o.id)).map((o) => run.morph(o, { o: 0 }, { dur })));
  const showAll = (run, L, ids, opts = {}) => Promise.all(ids.map((id, i) => pto(run, L, id, { ...opts, delay: (opts.delay ?? 0) + (opts.stagger ?? 0) * i })));
  // a bar grows to its α (or probability) and its number rides along its end
  async function growBar(run, L, bid, vid = null, { delay = 0, dur = 900 } = {}) {
    if (run.dead) return;
    const b = REG.get(bid), t = L.get(bid);
    b.setAlphaSrc(t.alphaSrc, t.kind);
    run.set(b, { x: t.x, y: t.y, o: t.o ?? 1, w: 0 });
    const ps = [run.tween(b, { w: t.w }, { dur, delay, ease: EASE.out })];
    if (vid) {
      const v = REG.get(vid), tv = L.get(vid);
      v.bind(tv.src, tv.d);
      run.set(v, { x: t.x + 14, y: tv.y, s: 1, o: 0, tf: 1 });
      ps.push(run.tween(v, { x: tv.x, o: tv.o ?? 1 }, { dur, delay, ease: EASE.out }));
    }
    await Promise.all(ps);
  }
  // a token that rides a path (the autoregressive loop), then settles into its place in layout L
  async function rideLoop(run, L, tokId, { from, dur = 1100 } = {}) {
    const lp = REG.get("dd:loop"), tl = L.get("dd:loop"), tok = REG.get(tokId);
    await run.morph(lp, { geo: tl.geo }, { dur: 0 });
    if (run.dead) return;
    run.set(lp, { o: 1, draw: 0 });
    run.set(tok, { x: from.x, y: from.y, s: 0.5, o: 1, pill: 0 });
    const ride = { f: 0, apply() { const p = lp.pointAt(this.f); tok.set({ x: p.x, y: p.y + 8 }); } };
    await Promise.all([run.tween(lp, { draw: 1 }, { dur }), run.tween(ride, { f: 1 }, { dur })]);
    await pto(run, L, tokId, { dur: 420 });
  }
  // a small glowing dot from one point to another (a query reaching the keys)
  async function flyDot(run, a, b, cls, { dur = 650, delay = 0, r = 5 } = {}) {
    const dot = run.own(new DotObj(null, LAYER.fx, { r, cls: `f-${cls}`, glow: `g-${cls}` }));
    run.set(dot, { x: a.x, y: a.y, o: 0 });
    await run.wait(delay);
    await run.tween(dot, { o: 1 }, { dur: 120 });
    await run.tween(dot, { x: b.x, y: b.y }, { dur });
    await run.tween(dot, { o: 0 }, { dur: 160 });
  }
  const HEADS = [...Array(PD.nHeads).keys()];
  const DD_PACE = 0.8; // the deep dive's beats play at 0.8× their written durations (about 70 s in all)

  // ---- Inside the decoder · 1: from the full Transformer, the encoder dims except its output; the decoder keeps only
  // <START>; then a zoom into the decoder's input: token → embedding → × √512 → + PE → x_START (1 × 512)
  async function ddStart(run) {
    const L = Ld_start(), isEnc = (id) => /^(enc:|tok:|stok:)/.test(id);
    await Promise.all([...REG.values()].filter((o) => o.id && o.o > 0.01).map((o) => {
      const id = o.id;
      if (/^p:/.test(id) || /^dtok:[1-9]/.test(id)) return run.morph(o, { o: 0 }, { dur: 500 });
      if (isEnc(id) && id !== "enc:w4") return run.morph(o, { o: 0.22, ...(o instanceof BoxObj ? { glow: 0 } : {}) }, { dur: 700 });
      if (USES.some(([u]) => u === id)) return run.morph(o, { glow: 0 }, { dur: 600 });
      return null;
    }));
    if (run.dead) return;
    // the encoder output still reaches the decoder's cross-attention
    await Promise.all([pulse(run, "x:k", "k", { dur: 800 }), pulse(run, "x:v", "v", { dur: 800, delay: 90 })]);
    if (run.dead) return;
    const tok = REG.get("dtok:0"), rest = [...REG.values()].filter((o) => o.id && o.o > 0.01 && o.id !== "dtok:0" && !/^(title|status|tag:paper)$/.test(o.id));
    await Promise.all([zoomObjs(run, rest, { cx: tok.x, cy: tok.y - 40, k: 2.4, dur: 1300 }), pto(run, L, "dtok:0", { dur: 1300 })]);
    if (run.dead) return;
    await showAll(run, L, ["cap:dstart", "dd:cr0"], { dur: 560 });
    await reveal(run, L, [["dd:wtok"]], { dur: 380 });
    await Promise.all([drawIn(run, L, "dd:raw", { dur: 760 }), pto(run, L, "dd:rawlab", { dur: 480, delay: 160 })]);
    // × √512: the same row, rescaled
    const emb = REG.get("dd:emb"), te = { ...emb.layoutDefaults(), ...L.get("dd:emb") };
    run.set(emb, { ...te, y: L.get("dd:raw").y, o: 0.02, nu: 0 });
    await Promise.all([run.tween(emb, { y: te.y, o: 1 }, { dur: 640 }), run.tween(emb, { nu: 1 }, { dur: 360, delay: 380 }), pto(run, L, "dd:emblab", { dur: 480, delay: 200 }), pto(run, L, "dd:sq", { dur: 480, delay: 420 })]);
    await Promise.all([drawIn(run, L, "dd:pe", { dur: 640 }), pto(run, L, "dd:pelab", { dur: 480 })]);
    await reveal(run, L, [["dd:rule"]], { dur: 320 });
    await Promise.all([drawIn(run, L, "dd:x", { dur: 760 }), pto(run, L, "dd:xlab", { dur: 480 }), pto(run, L, "dd:xshape", { dur: 480, delay: 300 })]);
    await pto(run, L, "dd:note1", { dur: 480 });
  }

  // ---- 2: masked multi-head self-attention — every head receives the WHOLE x_START, then projects it with its own
  // 512 × 64 matrices (head 1 in full, heads 2–8 in parallel)
  async function ddHeads(run) {
    const L = Ld_heads(), X = REG.get("dd:x");
    await fadeOutsideOf(run, L, 420);
    if (run.dead) return;
    await Promise.all([showAll(run, L, ["dd:x", "dd:xlab", "dd:xshape"], { dur: 760 }), showAll(run, L, ["cap:dheads", "dd:cr1"], { dur: 480, delay: 300 })]);
    if (run.dead) return;
    const G = X.geo(), sx = X.x + ((G.mid0 + G.mid1) / 2) * X.s, sw = (G.mid1 - G.mid0) * X.s, sh = G.sh * X.s;
    await Promise.all(HEADS.map((h) => {
      const m = REG.get(`dd:mx${h}`), t = L.get(`dd:mx${h}`);
      run.set(m, { ...m.layoutDefaults(), x: sx, y: X.y, w: sw, h: sh, s: 1, o: 0.85 });
      return run.tween(m, { x: t.x, y: t.y, w: t.w, h: t.h, o: 1 }, { dur: 860, delay: 60 * h });
    }));
    if (run.dead) return;
    await showAll(run, L, ["dd:h1tag", "dd:mx0lab", ...HEADS.slice(1).map((h) => `dd:ht${h}`)], { dur: 380, stagger: 30 });
    await reveal(run, L, [["dd:hw:q", "dd:hw:k", "dd:hw:v"]], { dur: 460 });
    await Promise.all(BRANCHES.flatMap((b, i) => [drawIn(run, L, `dd:${b}1`, { dur: 620, delay: 130 * i }), pto(run, L, `dd:${b}1lab`, { dur: 420, delay: 130 * i }), pto(run, L, `dd:${b}1dim`, { dur: 420, delay: 280 + 130 * i })]));
    if (run.dead) return;
    await Promise.all(HEADS.slice(1).flatMap((h) => [pto(run, L, `dd:hd${h}`, { dur: 380, delay: 45 * h }), ...BRANCHES.map((b) => drawIn(run, L, `dd:h${b}${h}`, { dur: 480, delay: 45 * h + 60 }))]));
    await pto(run, L, "dd:note2", { dur: 480 });
  }

  // ---- 3: t = 1 — a 1 × 1 score, ÷ √64 = 8, softmax over the one available position = [1]; head 1's output is v₁
  async function ddT1(run) {
    const L = Ld_t1(), q1 = REG.get("dd:q1"), k1 = REG.get("dd:k1");
    await fadeOutsideOf(run, L, 300);
    if (run.dead) return;
    await Promise.all([run.tween(q1, { glow: 1 }, { dur: 300 }), run.tween(k1, { glow: 1 }, { dur: 300 })]);
    await Promise.all([showAll(run, L, ["dd:s1", "dd:s1lab"], { dur: 480 }), pto(run, L, "dd:s1dim", { dur: 480, delay: 200 })]);
    await Promise.all([run.tween(q1, { glow: 0 }, { dur: 300 }), run.tween(k1, { glow: 0 }, { dur: 300 })]);
    await reveal(run, L, [["dd:ar1", "dd:ss1lab"], ["dd:ss1"]], { dur: 420, gap: 280 });
    await reveal(run, L, [["dd:ar2", "dd:sa1lab"], ["dd:sa1"]], { dur: 420, gap: 280 });
    await pto(run, L, "cap:dt1", { dur: 480 });
    if (run.dead) return;
    // head₁ = 1 · v₁: the value vector itself comes down
    const v1 = REG.get("dd:v1"), z1 = REG.get("dd:z1"), tz = { ...z1.layoutDefaults(), ...L.get("dd:z1") };
    run.set(z1, { ...tz, y: v1.y, o: 0.02 });
    await Promise.all([run.tween(z1, { y: tz.y, o: 1 }, { dur: 760 }), pto(run, L, "dd:z1lab", { dur: 420, delay: 300 }), pto(run, L, "dd:z1dim", { dur: 420, delay: 400 })]);
    if (run.dead) return;
    // the other seven heads at once: α = 1, so each head's output is its own value vector
    await Promise.all(HEADS.slice(1).flatMap((h) => {
      const hv = REG.get(`dd:hv${h}`), hz = REG.get(`dd:hz${h}`), t = L.get(`dd:hz${h}`);
      run.set(hz, { ...hz.layoutDefaults(), ...t, x: hv.x, y: hv.y, o: 0.02 });
      return [pto(run, L, `dd:hs${h}`, { dur: 380, delay: 45 * h }), run.tween(hz, { x: t.x, y: t.y, o: 1 }, { dur: 560, delay: 45 * h + 100 })];
    }));
    await pto(run, L, "dd:note3", { dur: 480 });
  }

  // ---- 4: the eight 1 × 64 head outputs slide together (Concat, 512), then W^O, the residual and LayerNorm
  async function ddConcat(run) {
    const L = Ld_concat(), outs = ["dd:z1", ...HEADS.slice(1).map((h) => `dd:hz${h}`)];
    await fadeExcept(run, L, outs, 400);
    if (run.dead) return;
    await run.morph("dd:z1", { c: 1 }, { dur: 480 });
    const cat = L.get("dd:cat"), seg = cat.w / PD.nHeads;
    await Promise.all(outs.map((id, h) => run.tween(REG.get(id), { x: cat.x - cat.w / 2 + seg * (h + 0.5), y: cat.y, ...(id === "dd:z1" ? {} : { w: seg, h: cat.h }) }, { dur: 860, delay: 45 * h })));
    if (run.dead) return;
    await Promise.all([pto(run, L, "dd:cat", { dur: 240 }), ...outs.map((id) => run.morph(id, { o: 0 }, { dur: 240 })), pto(run, L, "dd:catlab", { dur: 420 }), pto(run, L, "dd:catdim", { dur: 420, delay: 150 })]);
    await reveal(run, L, [["dd:mw1"], ["dd:wo", "dd:wolab", "dd:wodim"], ["dd:mw2"]], { dur: 420, gap: 240 });
    await Promise.all([drawIn(run, L, "dd:mh", { dur: 660 }), pto(run, L, "dd:mhlab", { dur: 420 })]);
    // x_START takes the residual path down to MultiHead; the sum is normalised: y = LayerNorm(x + MultiHead)
    await showAll(run, L, ["dd:x", "dd:reslab", "dd:resnote"], { dur: 860 });
    await reveal(run, L, [["dd:rule2"]], { dur: 320 });
    await Promise.all([drawIn(run, L, "dd:y", { dur: 700 }), pto(run, L, "dd:ylab", { dur: 420 }), pto(run, L, "dd:yshape", { dur: 420, delay: 300 })]);
    await pto(run, L, "cap:dconcat", { dur: 560 });
  }

  // ---- 5: encoder–decoder attention — the decoder state y moves right; the encoder output E (s × 512) comes in on
  // the left; K and V come out of E, q out of y
  async function ddCross(run) {
    const L = Ld_cross(), y = REG.get("dd:y"), ty = L.get("dd:yq");
    await fadeExcept(run, L, ["dd:y"], 400);
    if (run.dead) return;
    await Promise.all([run.tween(y, { x: ty.x, y: ty.y, s: 0.45, o: 0 }, { dur: 860 }), pto(run, L, "dd:yq", { dur: 460, delay: 460 }),
      showAll(run, L, ["dd:yqlab", "dd:Dtag"], { dur: 380, delay: 620 }), pto(run, L, "dd:cr2", { dur: 460 })]);
    if (run.dead) return;
    await Promise.all([...SRC_IDS.map((id, j) => pto(run, L, id, { dur: 460, delay: 55 * j })), drawIn(run, L, "dd:E", { dur: 760, delay: 160 }),
      pto(run, L, "dd:Etag", { dur: 380 }), pto(run, L, "dd:Elab", { dur: 380, delay: 260 })]);
    if (run.dead) return;
    const E = REG.get("dd:E");
    for (const id of ["dd:K", "dd:V"]) { const o = REG.get(id); run.set(o, { ...o.layoutDefaults(), ...L.get(id), x: E.x, o: 0.02, nu: 0 }); }
    await Promise.all([
      ...[["dd:K", 0], ["dd:V", 180]].flatMap(([id, dl]) => [run.tween(REG.get(id), { x: L.get(id).x, o: 1 }, { dur: 860, delay: dl }), run.tween(REG.get(id), { nu: 1 }, { dur: 380, delay: dl + 520 })]),
      showAll(run, L, ["dd:Klab", "dd:Vlab", "dd:Kdim", "dd:Vdim"], { dur: 420, delay: 480, stagger: 90 }),
    ]);
    if (run.dead) return;
    await reveal(run, L, [["dd:wq", "dd:cqlab"]], { dur: 460 });
    await Promise.all([pulse(run, "dd:wq", "q", { dur: 460 }), drawIn(run, L, "dd:cq", { dur: 660, delay: 260 }), pto(run, L, "dd:cqdim", { dur: 420, delay: 560 })]);
    await pto(run, L, "cap:dcross", { dur: 560 });
  }

  // ---- 6: one score per source token (q·k_j: 1 × s), ÷ √64, then softmax over the source
  async function ddScores(run) {
    const L = Ld_scores(), js = [...Array(S_LEN).keys()], cq = REG.get("dd:cq"), hd = L.get("dd:ahd");
    const sc = (j, k) => `dd.layers.0.cross.heads.0.${k}.0.${j}`;
    await fadeOutsideOf(run, L, 300);
    if (run.dead) return;
    run.set(REG.get("dd:schd"), { x: hd.x, y: hd.y, o: 0 });
    await Promise.all([run.tween(REG.get("dd:schd"), { o: 1 }, { dur: 380 }), run.morph(cq, { glow: 1 }, { dur: 300 }), run.morph("dd:K", { glow: 0.8 }, { dur: 300 })]);
    await Promise.all(js.map((j) => flyDot(run, { x: cq.x - cq.halfW(), y: cq.y }, { x: CT.scX + 30, y: ctY(j) }, "q", { dur: 620, delay: 45 * j })));
    if (run.dead) return;
    await Promise.all([...js.map((j) => run.morph(`dd:sc${j}`, { x: CT.scX, y: ctY(j), s: 1, o: 1, src: sc(j, "raw"), d: 2, tc: "" }, { dur: 380, delay: 45 * j })),
      pto(run, L, "dd:scdim", { dur: 420 }), run.morph(cq, { glow: 0 }, { dur: 380 }), run.morph("dd:K", { glow: 0 }, { dur: 380 })]);
    await run.wait(420);
    // ÷ √64 = 8, all at once
    run.set(REG.get("dd:schd2"), { x: hd.x, y: hd.y, o: 0 });
    await Promise.all([run.morph("dd:schd", { o: 0 }, { dur: 300 }), run.tween(REG.get("dd:schd2"), { o: 1 }, { dur: 300, delay: 200 }), ...js.map((j) => run.morph(`dd:sc${j}`, { src: sc(j, "scaled") }, { dur: 560 }))]);
    await run.wait(420);
    // softmax over the s source positions: weights α_j (illustrative), the bars grow to them
    await Promise.all([run.morph("dd:schd2", { o: 0 }, { dur: 300 }), pto(run, L, "dd:ahd", { dur: 420, delay: 200 }), ...js.map((j) => run.morph(`dd:sc${j}`, { src: sc(j, "A") }, { dur: 560 })),
      ...js.map((j) => growBar(run, L, `dd:bar${j}`, null, { delay: 300 + 60 * j }))]);
    await reveal(run, L, [["dd:asum"], ["dd:scnote", "cap:dscores"]], { dur: 460, gap: 220 });
  }

  // ---- 7: α_j v_j flow from the encoder into the decoder; Σ = head 1's output (1 × 64); with the other seven heads:
  // Concat (1 × 512) → W^O → + y, LayerNorm → z
  async function ddValues(run) {
    const L = Ld_values(), js = [...Array(S_LEN).keys()];
    await fadeOutsideOf(run, L, 300);
    if (run.dead) return;
    await Promise.all(js.map(async (j) => {
      const id = `dd:st${j}`, st = REG.get(id), t = L.get(id), a = crossA(j);
      await run.morph(st, { geo: t.geo, sw: t.sw, alphaSrc: t.alphaSrc }, { dur: 0 });
      if (run.dead) return;
      run.set(st, { o: t.o, draw: 0 });
      const dot = run.own(new DotObj(null, LAYER.fx, { r: 3 + 9 * a, cls: "f-v", glow: "g-v" }));
      const ride = { f: 0, apply() { const p = st.pointAt(this.f); dot.set({ x: p.x, y: p.y }); } };
      run.set(dot, { o: 1 }); ride.apply();
      await Promise.all([run.tween(st, { draw: 1 }, { dur: 1050 }), run.tween(ride, { f: 1 }, { dur: 1050 })]);
      await run.tween(dot, { o: 0 }, { dur: 180 });
    }));
    if (run.dead) return;
    await Promise.all([drawIn(run, L, "dd:cz", { dur: 660 }), pto(run, L, "dd:czlab", { dur: 420 })]);
    await reveal(run, L, [["dd:cw1"]], { dur: 360 });
    if (run.dead) return;
    // seven more heads, each with its own weights, beside head 1; then they slide together into Concat
    const cat = L.get("dd:ccat"), seg = cat.w / PD.nHeads, cz = REG.get("dd:cz");
    const spread = (h) => cat.x + (h - (PD.nHeads - 1) / 2) * (seg + 10);
    const first = run.own(new BlockObj(null, LAYER.fx, { url: HEAT.get("dd.layers.0.cross.heads.0.Z.0|all"), tone: "v", w: seg, h: cat.h }));
    const strips = [first, ...HEADS.slice(1).map((h) => REG.get(`dd:cz${h}`))];
    run.set(first, { x: cz.x, y: cz.y, s: 1, o: 1 });
    strips.slice(1).forEach((b, i) => run.set(b, { ...b.layoutDefaults(), x: spread(i + 1), y: cat.y, w: seg, h: cat.h, s: 1, o: 0 }));
    await Promise.all([run.tween(first, { x: spread(0), y: cat.y }, { dur: 620 }), ...strips.slice(1).map((b, i) => run.tween(b, { o: 1 }, { dur: 360, delay: 200 + 50 * i }))]);
    await Promise.all(strips.map((b, h) => run.tween(b, { x: cat.x - cat.w / 2 + seg * (h + 0.5) }, { dur: 560 })));
    if (run.dead) return;
    await Promise.all([pto(run, L, "dd:ccat", { dur: 240 }), ...strips.map((b) => run.tween(b, { o: 0 }, { dur: 240 })), pto(run, L, "dd:ccatlab", { dur: 420 })]);
    await reveal(run, L, [["dd:cw2", "dd:cnorm"]], { dur: 420 });
    await Promise.all([drawIn(run, L, "dd:z", { dur: 660 }), pto(run, L, "dd:zlab", { dur: 420 }), pto(run, L, "dd:zshape", { dur: 420, delay: 300 })]);
    await pto(run, L, "cap:dvalues", { dur: 560 });
  }

  // ---- 8: the position-wise FFN: 512 → 2048 (ReLU zeroes every negative unit) → 512, then Add & Norm
  async function ddFfn(run) {
    const L = Ld_ffn();
    await fadeOutsideOf(run, L, 400);
    if (run.dead) return;
    await Promise.all([pto(run, L, "dd:cr3", { dur: 460 }), showAll(run, L, ["dd:z", "dd:zlab", "dd:zshape"], { dur: 860 })]);
    await reveal(run, L, [["dd:fw1", "dd:w1lab"]], { dur: 420 });
    if (run.dead) return;
    const hp = REG.get("dd:hpre"), th = L.get("dd:hid");
    run.set(hp, { ...hp.layoutDefaults(), ...th, o: 1, draw: 0 });
    await run.tween(hp, { draw: 1 }, { dur: 860, ease: EASE.out });
    await run.wait(260);
    await Promise.all([pto(run, L, "dd:hid", { dur: 560 }), run.tween(hp, { o: 0 }, { dur: 560 }), pto(run, L, "dd:hidlab", { dur: 420 }), pto(run, L, "dd:zeros", { dur: 420, delay: 300 })]);
    await reveal(run, L, [["dd:fw2", "dd:w2lab"]], { dur: 420 });
    await Promise.all([drawIn(run, L, "dd:ffo", { dur: 660 }), pto(run, L, "dd:ffolab", { dur: 420 }), pto(run, L, "dd:ffoshape", { dur: 420, delay: 300 })]);
    await reveal(run, L, [["dd:fw3", "dd:ffnorm"]], { dur: 420 });
    await Promise.all([drawIn(run, L, "dd:l1", { dur: 700 }), pto(run, L, "dd:l1shape", { dur: 420, delay: 300 }), pto(run, L, "dd:l1lab", { dur: 420, delay: 380 })]);
    await pto(run, L, "cap:dffn", { dur: 560 });
  }

  // ---- 9: that whole layer becomes one block; the stack has six, each with its own weights; the encoder output
  // reaches the cross-attention of every one of them
  async function ddLayers(run) {
    const L = Ld_layers(), t1 = L.get("dd:L1"), box = REG.get("dd:L1");
    const content = [...REG.values()].filter((o) => o.id && o.o > 0.01 && /^dd:/.test(o.id) && !/^dd:(cr|L\d)/.test(o.id));
    run.set(box, { ...box.layoutDefaults(), x: 960, y: 516, w: 1180, h: 520, s: 1, o: 0.02, lo: 0, glow: 0 });
    await Promise.all([run.tween(box, { o: 1 }, { dur: 360 }),
      ...[...REG.values()].filter((o) => o.id && o.o > 0.01 && /^(cap:|dd:cr)/.test(o.id) && !L.has(o.id)).map((o) => run.morph(o, { o: 0 }, { dur: 360 }))]);
    if (run.dead) return;
    await Promise.all([run.tween(box, { x: t1.x, y: t1.y, w: t1.w, h: t1.h, lo: 1, glow: t1.glow }, { dur: 1050 }),
      zoomObjs(run, content, { cx: 960, cy: 516, tx: t1.x, ty: t1.y, k: 0.12, dur: 1050 }), pto(run, L, "dd:cr4", { dur: 460 })]);
    if (run.dead) return;
    await pto(run, L, "cap:dlayers", { dur: 520 });
    await Promise.all([2, 3, 4, 5, 6].map((k, i) => {
      const b = REG.get(`dd:L${k}`), t = { ...b.layoutDefaults(), ...L.get(`dd:L${k}`) };
      run.set(b, { ...t, y: t1.y, o: 0.02 });
      return run.tween(b, { y: t.y, o: t.o }, { dur: 760, delay: 110 * i });
    }));
    await reveal(run, L, [["dd:lup0", "dd:lin0lab"], ["dd:lup1", "dd:lup2", "dd:lup3", "dd:lup4", "dd:lup5"], ["dd:n6", "dd:sublab"]], { dur: 380, gap: 200 });
    await Promise.all([drawIn(run, L, "dd:E", { dur: 620 }), pto(run, L, "dd:Etag", { dur: 380 })]);
    await reveal(run, L, [["dd:bus"], [1, 2, 3, 4, 5, 6].map((k) => `dd:tap${k}`), ["dd:buslab"]], { dur: 460, gap: 260 });
    await pulse(run, "dd:bus", "k", { dur: 760 });
  }

  // ---- 10: after layer 6, the newest position's 512 numbers → Linear → logits → softmax → next token; it is appended
  // to the output and fed back as the next decoder input
  async function ddToken(run) {
    const L = Ld_token(), hl = REG.get("dd:hl"), th = { ...hl.layoutDefaults(), ...L.get("dd:hl") }, L6 = REG.get("dd:L6");
    run.set(hl, { ...th, x: L6.x, y: L6.y, s: 0.35, o: 0.02, nu: 0 });
    await Promise.all([fadeOutsideOf(run, L, 480), run.tween(hl, { x: th.x, y: th.y, s: 1, o: 1 }, { dur: 960 }), run.tween(hl, { nu: 1 }, { dur: 380, delay: 660 }),
      showAll(run, L, ["dd:hllab", "dd:hlshape", "dd:hlnote"], { dur: 420, delay: 660, stagger: 100 }), pto(run, L, "dd:cr5", { dur: 460 })]);
    await pto(run, L, "cap:dtoken", { dur: 560 });
    await run.wait(320);
    await reveal(run, L, [["dd:tw1"], ["dec:lin", "dd:lindim"], ["dd:tw2"], ["dec:sm", "dd:smdim"], ["dd:tw3"]], { dur: 380, gap: 210 });
    if (run.dead) return;
    await Promise.all(DD.next[0].vocab.flatMap((w, k) => [run.morph(`dd:pw${k}`, { ...L.get(`dd:pw${k}`), ...(w === "…" ? {} : { pill: 0 }) }, { dur: 380, delay: 50 * k }),
      growBar(run, L, `dd:pb${k}`, `dd:pv${k}`, { delay: 60 * k, dur: 860 })]));
    await Promise.all([pto(run, L, "dd:pnote", { dur: 420 }), pto(run, L, "dd:pw0", { dur: 420, delay: 160 })]);
    if (run.dead) return;
    // predict → append: the chosen token joins the output so far
    const w0 = REG.get("dd:pw0"), o0 = REG.get("outl:0"), to = L.get("outl:0");
    await pto(run, L, "dd:outtag", { dur: 380 });
    run.set(o0, { x: w0.x, y: w0.y, s: w0.s, o: 1, pill: 0 });
    await run.tween(o0, { x: to.x, y: to.y, s: to.s }, { dur: 820 });
    // → feed back: it becomes the next decoder input (the outputs, shifted right by one)
    await showAll(run, L, ["dd:intag", "dtok:0"], { dur: 380 });
    await rideLoop(run, L, "dtok:1", { from: { x: to.x, y: to.y }, dur: 1100 });
    await pto(run, L, "dd:looplab", { dur: 460 });
  }

  // ---- 11: t = 2 — two decoder positions; head 1's 2 × 2 scores; the causal mask (−∞) now blocks a real future
  // position, which softmax turns into exactly 0; the cross-attention weights grow from 1 × s to 2 × s
  async function ddMask(run) {
    const L = Ld_mask(), cell = (id) => /^dd:g[cv]\d\d$/.test(id);
    await fadeOutsideOf(run, L, 440);
    if (run.dead) return;
    await Promise.all([showAll(run, L, ["dtok:0", "dtok:1"], { dur: 860 }), drawIn(run, L, "dd:X2", { dur: 760, delay: 380 }), pto(run, L, "dd:X2lab", { dur: 420, delay: 560 }), pto(run, L, "dd:cr6", { dur: 460 })]);
    await reveal(run, L, [["dd:t2w"], ["dd:t2q", "dd:t2k", "dd:t2v"], ["dd:t2lab"]], { dur: 420, gap: 220 });
    if (run.dead) return;
    const stage = (k) => {
      const G = new Layout();
      for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++) {
        const masked = c > r, src = k === 0 ? `dd.layers.0.self.heads.0.unmasked.${r}.${c}` : `dd.layers.0.self.heads.0.scaled.${r}.${c}`;
        G.put(`dd:gc${r}${c}`, { ...L.get(`dd:gc${r}${c}`), cls: masked && k > 0 ? "cell-masked" : "cell" })
          .put(`dd:gv${r}${c}`, { ...L.get(`dd:gv${r}${c}`), src, d: 2, tc: masked && k > 0 ? "masked" : "" });
      }
      return G;
    };
    const S0 = stage(0), S1 = stage(1);
    await reveal(run, L, [["dd:gtitle"], ["dd:grl0", "dd:grl1", "dd:gcl0", "dd:gcl1"]], { dur: 380, gap: 140 });
    // QKᵀ / √64, before the mask …
    await Promise.all([...S0.keys()].map((id) => run.morph(id, S0.get(id), { dur: 420 })));
    await run.wait(520);
    // … the future position (key after the query) becomes −∞ …
    await Promise.all(["dd:gc01", "dd:gv01"].map((id) => run.morph(id, S1.get(id), { dur: 480 })));
    await run.wait(520);
    // … and softmax, row by row: the first position cannot look ahead (exactly 0); the second sees both
    await Promise.all([...L.keys()].filter(cell).map((id) => pto(run, L, id, { dur: 560, delay: 110 * Number(id.slice(-2, -1)) })));
    await Promise.all([pto(run, L, "cap:dmask", { dur: 560 }), pto(run, L, "dd:gnote", { dur: 460, delay: 160 })]);
    if (run.dead) return;
    const js = [...Array(S_LEN).keys()];

      const got = kind === "wire" ? parseFloat(el.style.strokeWidth) : parseFloat(el.getAttribute("width"));
      geometry.checked++;
      if (!(Math.abs(got - want) < 0.05)) geometry.mismatches.push({ src: el.dataset.alpha, kind, got, want });
    }
    return { checked, mismatches, badText, geometry };
  }

  // ---------------------------------------------------------------------------- EVENT HANDLERS & KEYBOARD
  function toggleCalc() {
    ui.showCalc = !ui.showCalc;
    hud.update();
    toast(ui.showCalc ? "Show calculation: on (slower, 3 decimals)" : "Show calculation: off");
    // replay the current beat with the new precision / pace
    const i = Math.max(0, director.index);
    if (i > 0) { director.jump(i - 1, 0); director.play(i); } else director.jump(i, 300);
  }
  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(() => toast("Fullscreen is not available here."));
  }
  function wire() {
    $("btn-next").addEventListener("click", () => director.next());
    $("btn-prev").addEventListener("click", () => director.prev());
    $("btn-play").addEventListener("click", () => director.togglePlay());
    $("btn-restart").addEventListener("click", () => director.restart());
    $("btn-calc").addEventListener("click", toggleCalc);
    $("btn-full").addEventListener("click", toggleFullscreen);
    $("btn-about").addEventListener("click", about);
    $("pe-math-btn").addEventListener("click", () => setPeMath(!ui.peMath));
    $("btn-explore").addEventListener("click", () => director.explore());
    $("dd-btn").addEventListener("click", () => director.decoder());
    document.querySelectorAll("#explore-ui [data-head]").forEach((b) => b.addEventListener("click", () => { const h = Number(b.dataset.head); if (h !== EX.h) exploreDo("head", () => { EX.h = h; }); }));
    document.querySelectorAll("#explore-ui [data-pos]").forEach((b) => b.addEventListener("click", () => { const on = b.dataset.pos === "1"; if (on !== EX.pos) exploreDo("pos", () => { EX.pos = on; }); }));
    document.querySelectorAll("#explore-ui [data-scale]").forEach((b) => b.addEventListener("click", () => { const m = b.dataset.scale; if (m !== EX.scale) exploreDo("scale", () => { EX.scale = m; }); }));
    $("ex-scale").addEventListener("input", (e) => { const v = 2 ** Number(e.target.value); exploreDo("slide", () => { EX.custom = v; }); });
    reduceMQ.addEventListener("change", updateMotion);
    document.addEventListener("keydown", (e) => {
      const tag = (e.target && e.target.tagName) || "";
      if (["INPUT", "TEXTAREA", "SELECT"].includes(tag) || e.ctrlKey || e.metaKey || e.altKey) return;
      if (!$("about").hidden) { if (e.key === "Escape") closeAbout(); return; }
      const k = e.key;
      const act = {
        ArrowRight: () => director.next(), PageDown: () => director.next(),
        ArrowLeft: () => director.prev(), PageUp: () => director.prev(),
        " ": () => director.togglePlay(),
        r: () => director.restart(), R: () => director.restart(),
        f: toggleFullscreen, F: toggleFullscreen,
        c: toggleCalc, C: toggleCalc,
        n: () => { notes.open = !notes.open; hud.update(); }, N: () => { notes.open = !notes.open; hud.update(); },
        d: () => { debug.open = !debug.open; debug.render(); }, D: () => { debug.open = !debug.open; debug.render(); },
        m: () => { if (!$("pe-math-btn").hidden) setPeMath(!ui.peMath); }, M: () => { if (!$("pe-math-btn").hidden) setPeMath(!ui.peMath); },
        e: () => director.explore(), E: () => director.explore(),
        i: () => director.decoder(), I: () => director.decoder(),
        ArrowUp: () => { if (inExplore()) exploreSelect((EX.q + N - 1) % N); },
        ArrowDown: () => { if (inExplore()) exploreSelect((EX.q + 1) % N); },
        Escape: () => { if (ui.peMath) setPeMath(false); },
      }[k];
      if (act) { e.preventDefault(); act(); }
    });
    // Space must never also "click" a focused button
    document.addEventListener("keyup", (e) => { if (e.key === " " && e.target && e.target.tagName === "BUTTON") e.preventDefault(); });
    // fullscreen: hide cursor and dim controls after inactivity
    let idleTimer = 0;
    const wake = () => {
      document.body.classList.remove("idle");
      clearTimeout(idleTimer);
      if (document.fullscreenElement) idleTimer = setTimeout(() => document.body.classList.add("idle"), 2500);
    };
    document.addEventListener("mousemove", wake);
    document.addEventListener("fullscreenchange", wake);
  }

  // ---------------------------------------------------------------------------- TEST HOOKS (used by tests/browser.mjs)
  globalThis.__demo = {
    get index() { return director.index; },
    get beats() { return BEATS.map((b) => ({ scene: b.scene, id: b.id, branch: !!b.branch })); },
    nextOf: (i) => director.nextOf(i),
    prevOf: (i) => director.prevOf(i),
    decoder: () => director.decoder(),
    get decoderExample() { return { source: [...DD.source], prefix: [...DD.prefix], generated: [...DD.generated] }; },
    idle: () => !director.run && !clock.tweens.size && !clock.timers.size,
    next: () => director.next(),
    prev: () => director.prev(),
    goto: (i, dur = 0) => director.jump(i, dur),
    play: (i) => director.play(i),
    restart: () => director.restart(),
    toggleCalc,
    speed: (k) => { clock.speed = k; },
    audit,
    // every visible object's state, rounded: a beat must look identical whichever way it was reached
    snapshot() {
      const out = {}, n = (v) => Math.round(v * 2) / 2;
      for (const [id, o] of REG) {
        if (o.o < 0.01) continue;
        const st = { x: n(o.x), y: n(o.y), s: Math.round(o.s * 1000) / 1000, o: Math.round(o.o * 100) / 100 };
        if (o instanceof PathObj) { st.draw = Math.round(o.draw * 100) / 100; if (o.geoB) st.geo = o.geoB.map(n).join(","); if (o.sw !== undefined) st.sw = Math.round(o.sw * 100) / 100; }
        if (o instanceof BoxObj) Object.assign(st, { w: n(o.w), h: n(o.h), glow: Math.round(o.glow * 100) / 100, lo: Math.round(o.lo * 100) / 100, ts: Math.round(o.ts * 1000) / 1000, cls: o.cls });
        const src = (v) => v && v.replace(/^ex\d+\./, "ex#."); // Explore's data versions are an implementation detail
        if (o instanceof VectorObj) Object.assign(st, { src: src(o.src), d: o.d, orient: o.orient, bw: n(o.bw), pl: Math.round(o.pl * 100) / 100 });
        if (o instanceof NumObj) Object.assign(st, { src: src(o.src), d: o.d });
        if (o instanceof BarObj) st.w = n(o.w);
        if (o instanceof TokenObj) Object.assign(st, { pill: Math.round(o.pill * 100) / 100, text: o.t.textContent });
        if (o instanceof TextObj) st.text = o.t.textContent;
        const r100 = (v) => Math.round(v * 100) / 100;
        if (o instanceof CMatObj) Object.assign(st, { c: r100(o.c), so: r100(o.so), nu: r100(o.nu), ix: r100(o.ix), hla: r100(o.hla), draw: r100(o.draw), glow: r100(o.glow) });
        if (o instanceof BlockObj) Object.assign(st, { w: n(o.w), h: n(o.h), glow: r100(o.glow), hla: r100(o.hla), draw: r100(o.draw) });
        out[id] = st;
      }
      return out;
    },
    get showCalc() { return ui.showCalc; },
    explore: {
      enter: () => director.explore(),
      select: (j) => exploreSelect(j),
      head: (h) => { if (h !== EX.h) exploreDo("head", () => { EX.h = h; }); },
      pos: (on) => { if (on !== EX.pos) exploreDo("pos", () => { EX.pos = on; }); },
      scale: (mode, v) => exploreDo(mode === "custom" ? "slide" : "scale", () => { EX.scale = mode; if (v !== undefined) EX.custom = v; }),
      get state() { return { q: EX.q, h: EX.h, pos: EX.pos, scale: EX.scale, divisor: exScaleValue() }; },
    },
    ready: false,
  };

  // ---------------------------------------------------------------------------- BOOTSTRAP / INIT
  async function init() {
    build();
    await (document.fonts ? document.fonts.ready : Promise.resolve());
    measure();
    hud.build();
    wire();
    globalThis.__demo.ready = true;
    director.play(0);
  }
  init();
})();
</script>
</body>
