      async play(run) {
        if (ui.showCalc) {
          for (const b of ["k", "v"]) { await multiplyDetail(run, b, { pace: 0.8 }); await run.morph(`eqn:${b}`, { x: BX[b], y: Y.eqn, o: 1 }, { dur: 500 }); }
          return;
        }
        await Promise.all(["k", "v"].map((b, k) => pulse(run, `wire:${b}`, BR[b].color, { dur: 800, delay: k * 150 })));
        const W = ["k", "v"].map((b) => REG.get(`W:${b}`));
        await Promise.all(W.flatMap((m) => m.cells.map((c) => run.tween(c, { h: 0.7 }, { dur: 250 }))));
        await Promise.all(W.flatMap((m) => m.cells.map((c) => run.tween(c, { h: 0 }, { dur: 400 }))));
        const L = L4_kv();
        await Promise.all(["k", "v"].flatMap((b, k) => [
          run.morph(`res:${b}`, L.get(`res:${b}`), { dur: 600, delay: k * 150 }),
          run.morph(`reslab:${b}`, L.get(`reslab:${b}`), { dur: 600, delay: k * 150 }),
          run.morph(`eqn:${b}`, L.get(`eqn:${b}`), { dur: 600, delay: 300 + k * 150 }),
        ]));
      } },
    { scene: 3, id: "intuition", layout: L4_intuition,
      async play(run) {
        await Promise.all(BRANCHES.map((b, k) => run.morph(`intu:${b}`, { x: BX[b], y: Y.intu + 6, o: 1 }, { dur: 700, delay: k * 260 })));
      } },
    { scene: 3, id: "alltokens", layout: L4_all,
      async play(run) {
        const fade = ["xlab", "cap:follow", ...BRANCHES.flatMap((b) => [`wire:${b}`, `reslab:${b}`, `eqn:${b}`, `intu:${b}`])];
        await Promise.all(fade.map((id) => run.morph(id, { o: 0 }, { dur: 450 })));
        // every token's x comes back into view; "it" returns to its column
        const L0 = vectorCols(tokenRow(HUD(new Layout())), { src: "X" });
        await Promise.all([...Array(N).keys()].flatMap((j) => [run.morph(`tok:${j}`, L0.get(`tok:${j}`), { dur: 700 }), run.morph(`node:${j}`, L0.get(`node:${j}`), { dur: 700 }), run.morph(`vec:${j}`, L0.get(`vec:${j}`), { dur: 900 })]));
        // the same matrices act on all tokens at once
        const mats = BRANCHES.map((b) => REG.get(`W:${b}`));
        await Promise.all(mats.flatMap((m) => m.cells.map((c) => run.tween(c, { h: 0.65 }, { dur: 260 }))));
        run.morph("cap:same", { x: 960, y: Y.cap, o: 1 }, { dur: 700 });
        const L = L4_all();
        const ps = [...mats.flatMap((m) => m.cells.map((c) => run.tween(c, { h: 0 }, { dur: 500 })))];
        BRANCHES.forEach((b, k) => {
          for (let j = 0; j < N; j++) {
            if (j === FOCUS) continue;
            const chip = REG.get(`chip:${b}:${j}`);
            run.set(chip, { x: colX(j), y: Y.vec, s: 0.5, o: 0 });
            ps.push(run.tween(chip, { y: ROWY[b], s: 1, o: 1 }, { dur: 800, delay: 250 + k * 220 + j * 25, ease: EASE.out }));
          }
          ps.push(run.morph(`res:${b}`, L.get(`res:${b}`), { dur: 1000, delay: k * 220 }));
          ps.push(run.morph(`rowlab:${b}`, L.get(`rowlab:${b}`), { dur: 600, delay: 600 + k * 220 }));
          ps.push(run.morph(`mateq:${b}`, L.get(`mateq:${b}`), { dur: 700, delay: 900 + k * 220 }));
        });
        for (let j = 0; j < N; j++) ps.push(run.morph(`vec:${j}`, { o: 0 }, { dur: 600, delay: 300 }));
        await Promise.all(ps);
      } },
    // ---- Scene 5 — QUERY MEETS KEYS
    { scene: 4, id: "arrange", layout: L5_arrange, async play(run) { await applyLayout(L5_arrange(), { dur: 1400, run }); } },
    { scene: 4, id: "dot", layout: L5_one, play: (run) => dotDetail(run) },
    { scene: 4, id: "allscores", layout: L5_all, play: (run) => allScores(run) },
    // ---- Scene 6 — SCALE + SOFTMAX
    { scene: 5, id: "pipeline", layout: L6_pipe, play: (run) => pipeline(run) },
    { scene: 5, id: "scale", layout: L6_scaled, play: (run) => scaleScores(run) },
    { scene: 5, id: "softmax", layout: L6_soft, play: (run) => softmaxScores(run) },
    { scene: 5, id: "equation", layout: L6_eq, async play(run) { await applyLayout(L6_eq(), { dur: 1000, run }); } },
    // ---- Scene 7 — VALUES MOVE
    { scene: 6, id: "values", layout: L7_values, async play(run) { await applyLayout(L7_values(), { dur: 1000, run }); } },
    { scene: 6, id: "product", layout: L7_one, play: (run) => alphaDetail(run) },
    { scene: 6, id: "products", layout: L7_all, play: (run) => allProducts(run) },
    { scene: 6, id: "flow", layout: L7_flow, play: (run) => flowValues(run) },
    { scene: 6, id: "result", layout: L7_result, async play(run) { await applyLayout(L7_result(), { dur: 1300, run }); } },
  ];

  // ---------------------------------------------------------------------------- DIRECTOR (navigation)
  const director = {
    gen: 0, index: -1, run: null, autoplay: false,
    async play(i) {
      this.gen++;
      const run = new Run(this.gen);
      this.run = run;
      this.index = i;
      hud.update();
      run.done = (async () => {
        try {
          const beat = BEATS[i];
          if (beat.play) await beat.play(run); else await applyLayout(beat.layout(), { dur: 900, run });
        } finally {
          if (!run.dead) {
            run.cleanup();
            await applyLayout(layoutOf(i), { dur: 0 });
            this.run = null;
            hud.update();
          }
        }
      })();
      return run.done;
    },
    skip() { if (this.run) { this.run.skip = true; finishAll(); } },
    next() {
      if (clock.frozen) freeze(false);
      if (this.run) { this.skip(); return; }
      if (this.index < BEATS.length - 1) this.play(this.index + 1);
      else toast("Scenes 8–10 are built in M4–M5.");
    },
    prev() {
      if (clock.frozen) freeze(false);
      this.autoplay = false;
      this.jump(Math.max(0, this.index - 1));
    },
    jump(i, dur = 700) {
      this.gen++;
      if (this.run) { this.run.cleanup(); this.run = null; }
      finishAll();
      this.index = i;
      hud.update();
      return applyLayout(layoutOf(i), { dur });
    },
    restart() {
      this.autoplay = false;
      if (clock.frozen) freeze(false);
      this.gen++;
      if (this.run) { this.run.cleanup(); this.run = null; }
      finishAll();
      for (const o of REG.values()) { o.o = 0; o.apply(); }
      this.index = -1;
      return this.play(0);
    },
    async autoplayLoop() {
      while (this.autoplay) {
        if (this.run) await this.run.done;
        if (!this.autoplay) break;
        const b = BEATS[this.index];
        const atSceneEnd = this.index === BEATS.length - 1 || BEATS[this.index + 1].scene !== b.scene;
        if (atSceneEnd) break;
        await wait(b.dwell ?? 2600);
        if (!this.autoplay || this.run) continue;
        this.play(this.index + 1);
      }
      this.autoplay = false;
      hud.update();
    },
    togglePlay() {
      if (clock.frozen) { freeze(false); hud.update(); return; }
      if (this.autoplay || this.run) { freeze(true); hud.update(); return; }
      this.autoplay = true;
      hud.update();
      const b = BEATS[this.index];
      const atSceneEnd = this.index === BEATS.length - 1 || BEATS[this.index + 1].scene !== b.scene;
      if (atSceneEnd && this.index < BEATS.length - 1) this.play(this.index + 1);
      this.autoplayLoop();
    },
  };

  // ---------------------------------------------------------------------------- HUD, TIMELINE, PANELS
  const $ = (id) => document.getElementById(id);
  let toastTimer = 0;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  }
  const hud = {
    built: false,
    build() {
      const nav = $("timeline");
      SCENES.forEach((s, k) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = s.label;
        b.dataset.scene = k;
        if (s.todo) { b.classList.add("todo"); b.disabled = true; b.title = `Built in ${s.todo}`; }
        else b.title = `${k + 1}. ${s.title}`;
        b.addEventListener("click", () => { director.autoplay = false; director.jump(BEATS.findIndex((x) => x.scene === k)); });
        nav.appendChild(b);
      });
      const ex = document.createElement("button");
      ex.type = "button"; ex.textContent = "Explore"; ex.disabled = true; ex.classList.add("todo"); ex.title = "Built in M4";
      nav.appendChild(ex);
      this.built = true;
    },
    update() {
      const i = Math.max(0, director.index);
      const beat = BEATS[i];
      const sc = SCENES[beat.scene];
      const st = REG.get("status");
      st.t.textContent = `${beat.scene + 1} / ${SCENES.length}  ·  ${sc.title}`;
      document.querySelectorAll("#timeline button[data-scene]").forEach((b) => {
        const k = Number(b.dataset.scene);
        b.classList.toggle("current", k === beat.scene);
        b.classList.toggle("past", k < beat.scene);
        if (k === beat.scene) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      });
      const playing = !clock.frozen && (director.autoplay || director.run);
      $("play-icon").setAttribute("d", playing ? "M6.5 4.5h4v15h-4zm7 0h4v15h-4z" : "M7 4.5v15l12-7.5z");
      $("btn-play").setAttribute("aria-label", playing ? "Pause (Space)" : "Play (Space)");
      $("btn-prev").disabled = director.index <= 0 && !director.run;
      $("btn-calc").setAttribute("aria-pressed", String(ui.showCalc));
      const inPE = beat.scene === 2;
      $("pe-math-btn").hidden = !inPE;
      if (!inPE && ui.peMath) setPeMath(false);
      notes.render(beat);
      if (debug.open) debug.render();
    },
  };
  function setPeMath(on) {
    ui.peMath = on;
    $("pe-math").hidden = !on;
    $("pe-math-btn").setAttribute("aria-expanded", String(on));
  }
  const notes = {
    open: false,
    render(beat) {
      const el = $("notes");
      el.hidden = !this.open;
      if (!this.open) return;
      el.innerHTML = `<h2>Presenter notes · ${beat.scene + 1}. ${SCENES[beat.scene].title}</h2><p>${NOTES[beat.scene] ?? ""}</p><p style="color:var(--ink-faint)">beat ${director.index + 1}/${BEATS.length} · ${beat.id} · N to hide</p>`;
    },
  };
  const debug = {
    open: false,
    table(title, M, rowLabels, colLabels, p = 6) {
      const head = `<tr><th></th>${colLabels.map((c) => `<th>${c}</th>`).join("")}</tr>`;
      const body = M.map((row, i) => `<tr><th>${rowLabels[i]}</th>${row.map((v) => `<td>${Number.isFinite(v) ? v.toFixed(p) : String(v)}</td>`).join("")}</tr>`).join("");
      return `<div>${title}</div><table>${head}${body}</table>`;
    },
    render() {
      const el = $("debug");
      el.hidden = !this.open;
      if (!this.open) return;
      const a = audit();
      const dims = ["d0", "d1", "d2", "d3"];
      let html = `<h2>Verification (D to hide)</h2><p>Display audit: <span class="${a.mismatches.length || a.badText.length ? "bad" : "ok"}">${a.checked} visible numbers checked · ${a.mismatches.length} mismatches · ${a.badText.length} invalid strings</span> <button type="button" id="dbg-audit">re-run</button></p>`;
      html += `<p>Attention geometry: <span class="${a.geometry.mismatches.length ? "bad" : "ok"}">${a.geometry.checked} bars/wires checked against α · ${a.geometry.mismatches.length} mismatches</span></p>`;
      html += `<p>Embeddings already include ×√d_model (paper §3.4); lookup is case-insensitive (pedagogical choice).</p>`;
      html += this.table("E (embeddings)", MODEL.E, TOKENS, dims);
      html += this.table("P (positional encoding)", MODEL.P, TOKENS, dims);
      html += this.table("X = E + P", MODEL.X, TOKENS, dims);
      MODEL.heads.forEach((H, h) => {
        html += this.table(`Head ${h + 1}: Q`, H.Q, TOKENS, ["q1", "q2"]);
        html += this.table(`Head ${h + 1}: K`, H.K, TOKENS, ["k1", "k2"]);
        html += this.table(`Head ${h + 1}: V`, H.V, TOKENS, ["v1", "v2"]);
        html += this.table(`Head ${h + 1}: QKᵀ (raw)`, H.raw, TOKENS, TOKENS, 4);
        html += this.table(`Head ${h + 1}: softmax(QKᵀ/√d_k)`, H.A, TOKENS, TOKENS, 4);
      });
      html += this.table("Concat(head_1, head_2)", MODEL.Concat, TOKENS, ["h1₁", "h1₂", "h2₁", "h2₂"]);
      html += this.table("MultiHead = Concat·W_O", MODEL.MH, TOKENS, dims);
      el.innerHTML = html;
      $("dbg-audit").addEventListener("click", () => this.render());
    },
  };
  function about() {
    const el = $("about");
    el.innerHTML = `<h2 id="about-title">About this demo</h2>
      <p class="lead">Built with LLM coding assistance.</p>
      <p>The demo uses a scaled-down Transformer attention calculation with pedagogical parameters. The mathematical operations follow Vaswani et al. (2017).</p>
      <p>Tiny teaching model — dimensions reduced so every calculation can be shown (d_model = 4, 2 heads, d_k = d_v = 2; the paper's base model uses 512, 8, 64). The mechanism is real Transformer attention. The small vectors and weights are illustrative teaching values, not weights from the original trained model.</p>
      <p>What we asked the coding assistant to build:</p><p class="edit">${DISCLOSURE.asked}</p>
      <p>What we manually checked or fixed:</p><p class="edit">${DISCLOSURE.checked}</p>
      <label><input type="checkbox" id="force-motion" ${ui.forceMotion ? "checked" : ""}> Animate even when the system asks for reduced motion${reduceMQ.matches ? " (reduced motion is on)" : ""}</label>
      <dl><dt>→ / PgDn</dt><dd>next step (finishes a running animation first)</dd><dt>← / PgUp</dt><dd>previous step</dd><dt>Space</dt><dd>play / pause</dd><dt>C</dt><dd>show calculation (slower, 3 decimals)</dd><dt>R</dt><dd>restart</dd><dt>F</dt><dd>fullscreen</dd><dt>N</dt><dd>presenter notes</dd><dt>D</dt><dd>verification panel</dd><dt>M</dt><dd>positional-encoding formula (Scene 3)</dd></dl>
      <button type="button" id="about-close">Close</button>`;
    el.hidden = false;
    $("about-close").addEventListener("click", closeAbout);
    $("force-motion").addEventListener("change", (e) => { ui.forceMotion = e.target.checked; updateMotion(); });
    $("about-close").focus();
  }
  function closeAbout() { $("about").hidden = true; $("btn-about").focus(); }

  // ---------------------------------------------------------------------------- AUDIT (display ↔ engine)
  function shown(el) {
    for (let n = el; n && n.id !== "stage"; n = n.parentNode) {
      if (n.style && (n.style.visibility === "hidden" || (n.style.opacity !== "" && Number(n.style.opacity) < 0.01))) return false;
    }
    return true;
  }
  function audit() {
    const mismatches = [];
    let checked = 0;
    for (const el of document.querySelectorAll("#stage [data-src]")) {
      if (!shown(el)) continue;
      checked++;
      const want = E.fmt(val(el.dataset.src), Number(el.dataset.digits));
      if (el.textContent !== want) mismatches.push({ src: el.dataset.src, shown: el.textContent, want });
    }
    const badText = [];
    for (const t of document.querySelectorAll("#stage text")) if (shown(t) && /NaN|undefined|Infinity|null/.test(t.textContent)) badText.push(t.textContent);
    // geometry bound to α: bar length = barLen(α), wire width = alphaWidth(α) — the same α everywhere
    const geometry = { checked: 0, mismatches: [] };
    for (const el of document.querySelectorAll("#stage [data-alpha]")) {
      if (!shown(el)) continue;
      const a = val(el.dataset.alpha), kind = el.dataset.kind;
      const want = kind === "bar" ? barLen(a) : alphaWidth(a);
      const got = kind === "bar" ? parseFloat(el.getAttribute("width")) : parseFloat(el.style.strokeWidth);
      geometry.checked++;
      if (!(Math.abs(got - want) < 0.05)) geometry.mismatches.push({ src: el.dataset.alpha, kind, got, want });
    }
    return { checked, mismatches, badText, geometry };
  }

  // ---------------------------------------------------------------------------- EVENT HANDLERS & KEYBOARD
  function toggleCalc() {
    ui.showCalc = !ui.showCalc;
    hud.update();
    toast(ui.showCalc ? "Show calculation: on (slower, 3 decimals)" : "Show calculation: off");
    // replay the current beat with the new precision / pace
    const i = Math.max(0, director.index);
    if (i > 0) { director.jump(i - 1, 0); director.play(i); } else director.jump(i, 300);
  }
  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(() => toast("Fullscreen is not available here."));
  }
  function wire() {
    $("btn-next").addEventListener("click", () => director.next());
    $("btn-prev").addEventListener("click", () => director.prev());
    $("btn-play").addEventListener("click", () => director.togglePlay());
    $("btn-restart").addEventListener("click", () => director.restart());
    $("btn-calc").addEventListener("click", toggleCalc);
    $("btn-full").addEventListener("click", toggleFullscreen);
    $("btn-about").addEventListener("click", about);
    $("pe-math-btn").addEventListener("click", () => setPeMath(!ui.peMath));
    reduceMQ.addEventListener("change", updateMotion);
    document.addEventListener("keydown", (e) => {
      const tag = (e.target && e.target.tagName) || "";
      if (["INPUT", "TEXTAREA", "SELECT"].includes(tag) || e.ctrlKey || e.metaKey || e.altKey) return;
      if (!$("about").hidden) { if (e.key === "Escape") closeAbout(); return; }
      const k = e.key;
      const act = {
        ArrowRight: () => director.next(), PageDown: () => director.next(),
        ArrowLeft: () => director.prev(), PageUp: () => director.prev(),
        " ": () => director.togglePlay(),
        r: () => director.restart(), R: () => director.restart(),
        f: toggleFullscreen, F: toggleFullscreen,
        c: toggleCalc, C: toggleCalc,
        n: () => { notes.open = !notes.open; hud.update(); }, N: () => { notes.open = !notes.open; hud.update(); },
        d: () => { debug.open = !debug.open; debug.render(); }, D: () => { debug.open = !debug.open; debug.render(); },
        m: () => { if (!$("pe-math-btn").hidden) setPeMath(!ui.peMath); }, M: () => { if (!$("pe-math-btn").hidden) setPeMath(!ui.peMath); },
        e: () => toast("Explore mode arrives in M4."), E: () => toast("Explore mode arrives in M4."),
        Escape: () => { if (ui.peMath) setPeMath(false); },
      }[k];
      if (act) { e.preventDefault(); act(); }
    });
    // Space must never also "click" a focused button
    document.addEventListener("keyup", (e) => { if (e.key === " " && e.target && e.target.tagName === "BUTTON") e.preventDefault(); });
    // fullscreen: hide cursor and dim controls after inactivity
    let idleTimer = 0;
    const wake = () => {
      document.body.classList.remove("idle");
      clearTimeout(idleTimer);
      if (document.fullscreenElement) idleTimer = setTimeout(() => document.body.classList.add("idle"), 2500);
    };
    document.addEventListener("mousemove", wake);
    document.addEventListener("fullscreenchange", wake);
  }

  // ---------------------------------------------------------------------------- TEST HOOKS (used by tests/browser.mjs)
  globalThis.__demo = {
    get index() { return director.index; },
    get beats() { return BEATS.map((b) => ({ scene: b.scene, id: b.id })); },
    idle: () => !director.run && !clock.tweens.size && !clock.timers.size,
    next: () => director.next(),
    prev: () => director.prev(),
    goto: (i, dur = 0) => director.jump(i, dur),
    play: (i) => director.play(i),
    restart: () => director.restart(),
    toggleCalc,
    speed: (k) => { clock.speed = k; },
    audit,
    get showCalc() { return ui.showCalc; },
    ready: false,
  };

  // ---------------------------------------------------------------------------- BOOTSTRAP / INIT
  async function init() {
    build();
    await (document.fonts ? document.fonts.ready : Promise.resolve());
    measure();
    hud.build();
    wire();
    globalThis.__demo.ready = true;
    director.play(0);
  }
  init();
})();
</script>
</body>
</html>
